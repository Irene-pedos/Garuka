services:
  postgres:
    image: postgres:16-alpine
    container_name: garuka-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Postgre123}
      POSTGRES_DB: ${POSTGRES_DB:-garuka}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d garuka"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
